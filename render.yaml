services:
  - type: web
    name: auth-messenger-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        value: https://auth-messenger-backend.onrender.com

      - key: APP_KEY
        sync: false

      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_URL
        fromDatabase:
          name: auth-db
          property: connectionString

      - key: SESSION_DRIVER
        value: file

      - key: CACHE_STORE
        value: file

  - type: web
    name: auth-messenger-frontend
    runtime: static

    buildCommand: "cd frontend && npm install && npm run build"

    staticPublishPath: "frontend/dist"

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://auth-messenger-backend.onrender.com/api

databases:
  - name: auth-db
    databaseName: auth_system
    user: auth_user
    plan: free
    region: oregon